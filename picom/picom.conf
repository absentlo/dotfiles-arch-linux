# Hardware-accelerated backend
backend = "glx";
vsync = true;

# GLX optimizations to fix multi-monitor stuttering
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;

# Subtle graphite-style shadows
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.4;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Disable resource-heavy effects
fading = false;
blur-background = false;
