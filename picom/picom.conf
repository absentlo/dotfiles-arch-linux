backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
log-level = "warn";

corner-radius = 10;
round-borders = 0;
detect-rounded-corners = true;
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'dmenu'",
    "window_type = 'tooltip'"
];

shadow = false;
fading = false;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 8;
blur-background = false;

wintypes:
{
    tooltip = { fade = false; shadow = false; };
    dock = { shadow = false; };
};
