# Low-spec (i5-4570, 8 GB, HD 8490). One flag per line, restart Brave to apply.
# GPU video decode via VA-API (UVD3 = H.264 only, falls back to CPU otherwise)
--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiVideoDecoder
# Cap renderer processes to save RAM (a crashed tab can take siblings with it)
--renderer-process-limit=4
