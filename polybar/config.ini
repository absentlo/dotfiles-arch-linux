; Graphite floating bar - low-spec build

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/main]
monitor =
width = 100%
height = 20
bottom = false
fixed-center = true

border-top-size = 4
border-bottom-size = 0
border-left-size = 10
border-right-size = 10
border-color = #00000000

radius = 0
line-size = 0
background = #00000000
foreground = #D8D8D8
padding-left = 1
padding-right = 1
module-margin = 0
separator =
separator-foreground = #3A3A3A

font-0 = "JetBrainsMono Nerd Font:size=8;2"
font-1 = "JetBrainsMono Nerd Font Propo:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=14;4"
font-3 = "DejaVu Sans:size=8;2"

modules-left = cl1 i3 cr1
modules-right = cl3 media bluetooth eth network cpu memory temperature filesystem updates a11y pulseaudio cr3 gap cl4 date tray cr4

enable-ipc = true
override-redirect = false
cursor-click = pointer

[module/i3]
format-background = #111111
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = #FFFFFF
label-focused = %{T2}%name%%{T-}
label-focused-foreground = #FFFFFF
label-focused-background = #3A3A3A
label-focused-padding = 2
label-unfocused = %{T2}%name%%{T-}
label-unfocused-foreground = #5A5A5A
label-unfocused-padding = 2
label-urgent = %{T2}%name%%{T-}
label-urgent-foreground = #FFFFFF
label-urgent-background = #C46A6A
label-urgent-padding = 2

[module/media]
format-background = #111111
format-padding = 1
type = custom/script
exec = ~/.local/bin/polybar-media
tail = true
format = <label>
format-prefix = "%{T2}󰎆%{T-} "
format-prefix-foreground = #8A8A8A
label = %output%
label-foreground = #D8D8D8
click-left = ~/.local/bin/i3-media popup &
click-middle = playerctl play-pause
click-right = playerctl next

[module/network]
format-connected-background = #111111
format-connected-padding = 1
format-disconnected-background = #111111
format-disconnected-padding = 1
type = internal/network
interface-type = wireless
interval = 10
format-connected = %{A1:~/.local/bin/i3-wifi &:}%{F#8A8A8A}%{T2}󰖩%{T-} %{F-}<label-connected>%{A}
label-connected = %signal%%
label-connected-foreground = #B8B8B8
format-disconnected = %{A1:~/.local/bin/i3-wifi &:}%{F#5A5A5A}%{T2}󰖪%{T-} %{F-}<label-disconnected>%{A}
label-disconnected = Offline
label-disconnected-foreground = #5A5A5A

[module/eth]
; shown only while the cable is connected; click opens the network menu
type = internal/network
interface-type = wired
interval = 10
format-connected = %{A1:~/.local/bin/i3-wifi &:}%{F#8A8A8A}%{T2}󰈀%{T-} %{F-}<label-connected>%{A}
format-connected-background = #111111
format-connected-padding = 1
label-connected = Ethernet
label-connected-foreground = #B8B8B8
format-disconnected =

[module/cpu]
format-background = #111111
format-padding = 1
type = internal/cpu
interval = 5
format-prefix = "%{A1:~/.local/bin/i3-btop &:}%{T2}󰻠%{T-} %{A}"
format-prefix-foreground = #8A8A8A
label = %{A1:~/.local/bin/i3-btop &:}%percentage:2%%%{A}
format-foreground = #B8B8B8

[module/memory]
format-background = #111111
format-padding = 1
type = internal/memory
interval = 30
format-prefix = "%{A1:~/.local/bin/i3-btop &:}%{T2}󰍛%{T-} %{A}"
format-prefix-foreground = #8A8A8A
label = %{A1:~/.local/bin/i3-btop &:}%used%%{A}
format-foreground = #9A9A9A

[module/temperature]
format-background = #111111
format-padding = 1
format-warn-background = #111111
format-warn-padding = 1
type = internal/temperature
interval = 20
thermal-zone = 2
warn-temperature = 80
format = <label>
format-prefix = "%{T2}󰔏%{T-} "
format-prefix-foreground = #8A8A8A
format-warn = <label-warn>
format-warn-prefix = "%{T2}󰸁%{T-} "
format-warn-prefix-foreground = #C46A6A
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = #C46A6A
format-foreground = #9A9A9A

[module/filesystem]
format-mounted-background = #111111
format-mounted-padding = 1
format-unmounted-background = #111111
format-unmounted-padding = 1
type = internal/fs
mount-0 = /
interval = 600
format-mounted-prefix = "%{T2}󰋊%{T-} "
format-mounted-prefix-foreground = #8A8A8A
label-mounted = %free%
format-mounted-foreground = #9A9A9A

[module/updates]
format-background = #111111
format-padding = 1
type = custom/script
exec = n=$(checkupdates 2>/dev/null | wc -l); echo "${n:-0}"
interval = 7200
format-prefix = "%{T2}󰚰%{T-} "
format-prefix-foreground = #8A8A8A
format-foreground = #D8D8D8
click-left = xfce4-terminal -x sh -c 'sudo pacman -Syu; echo Press Enter to close; read' &

[module/a11y]
; accessibility toggles: redrawn only when changed (polybar-msg), no polling
type = custom/ipc
hook-0 = ~/.local/bin/i3-a11y status
initial = 1
click-left = ~/.local/bin/i3-a11y menu &
format-background = #111111
format-padding = 1

[module/pulseaudio]
format-volume-background = #111111
format-volume-padding = 1
format-muted-background = #111111
format-muted-padding = 1
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-volume-foreground = #D8D8D8
label-muted = %{T2}󰝟%{T-} Mute
label-muted-foreground = #5A5A5A
ramp-volume-0 = %{T2}󰕿%{T-}
ramp-volume-1 = %{T2}󰖀%{T-}
ramp-volume-2 = %{T2}󰕾%{T-}
ramp-volume-foreground = #8A8A8A
click-right = pavucontrol &

[module/date]
format = %{A1:~/.local/bin/i3-calendar &:}%{F#8A8A8A}%{T2}󰃭%{T-} %{F-}<label>%{A}
format-background = #111111
format-padding = 1
type = internal/date
interval = 30
date = %a, %b %d · %H:%M
label = %date%
format-foreground = #F2F2F2

[module/tray]
format-background = #111111
type = internal/tray
format-padding = 4px
tray-spacing = 4px
tray-size = 12
tray-background = #111111

[module/bluetooth]
format-background = #111111
format-padding = 1
type = custom/script
exec = ~/.local/bin/i3-bluetooth status
interval = 30
format-prefix = "%{T2}󰂯%{T-} "
format-prefix-foreground = #8A8A8A
label = %output%
label-foreground = #B8B8B8
click-left = ~/.local/bin/i3-bluetooth popup &

; island caps: rounded Nerd Font glyphs in the island color
[module/cl1]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = #111111
[module/cr1]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = #111111
[module/cl3]
inherit = module/cl1
[module/cl4]
inherit = module/cl1
[module/cr3]
inherit = module/cr1
[module/cr4]
inherit = module/cr1
[module/gap]
type = custom/text
label = " "
