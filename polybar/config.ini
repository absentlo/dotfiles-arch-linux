; Graphite floating bar - low-spec build

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/main]
monitor =
width = 100%
height = 20
bottom = true
fixed-center = true

border-top-size = 0
border-bottom-size = 4
border-left-size = 10
border-right-size = 10
border-color = #00000000

radius = 0
line-size = 0
background = #00000000
foreground = #D8D8D8
padding-left = 1
padding-right = 1
module-margin = 0
separator =
separator-foreground = #3A3A3A

font-0 = "JetBrainsMono Nerd Font:size=8;2"
font-1 = "JetBrainsMono Nerd Font Propo:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=14;4"
font-3 = "DejaVu Sans:size=8;2"

modules-left = cl1 i3 cr1
modules-center = cl2 xwindow cr2
modules-right = cl3 media bluetooth network cpu memory temperature filesystem updates pulseaudio cr3 gap cl4 date tray cr4

enable-ipc = true
override-redirect = false
cursor-click = pointer

[module/i3]
format-background = #111111
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = #FFFFFF
label-focused = %name%
label-focused-foreground = #FFFFFF
label-focused-background = #252525
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = #555555
label-unfocused-padding = 2
label-urgent = %name%
label-urgent-foreground = #FFFFFF
label-urgent-background = #5A2A2A
label-urgent-padding = 2

[module/xwindow]
format-background = #111111
format-padding = 1
type = internal/xwindow
label = %title:0:45:...%
label-empty = Arch
label-foreground = #A0A0A0

[module/media]
format-background = #111111
format-padding = 1
type = custom/script
exec = ~/.local/bin/polybar-media
tail = true
format = <label>
format-prefix = "%{T2}󰎆%{T-} "
format-prefix-foreground = #888888
label = %output%
label-foreground = #D8D8D8
click-left = ~/.local/bin/i3-media popup &
click-middle = playerctl play-pause
click-right = playerctl next

[module/network]
format-connected-background = #111111
format-connected-padding = 1
format-disconnected-background = #111111
format-disconnected-padding = 1
type = internal/network
interface-type = wireless
interval = 10
click-left = ~/.local/bin/i3-wifi &
format-connected = <label-connected>
format-connected-prefix = "%{T2}󰖩%{T-} "
format-connected-prefix-foreground = #888888
label-connected = %essid:0:12:...%
label-connected-foreground = #B8B8B8
format-disconnected = <label-disconnected>
format-disconnected-prefix = "%{T2}󰖪%{T-} "
format-disconnected-prefix-foreground = #555555
label-disconnected = Offline
label-disconnected-foreground = #555555

[module/cpu]
format-background = #111111
format-padding = 1
type = internal/cpu
interval = 5
format-prefix = "%{T2}󰻠%{T-} "
format-prefix-foreground = #888888
label = %percentage:2%%
format-foreground = #B8B8B8

[module/memory]
format-background = #111111
format-padding = 1
type = internal/memory
interval = 30
format-prefix = "%{T2}󰍛%{T-} "
format-prefix-foreground = #888888
label = %used%
format-foreground = #9A9A9A

[module/temperature]
format-background = #111111
format-padding = 1
format-warn-background = #111111
format-warn-padding = 1
type = internal/temperature
interval = 20
thermal-zone = 2
warn-temperature = 80
format = <label>
format-prefix = "%{T2}󰔏%{T-} "
format-prefix-foreground = #888888
format-warn = <label-warn>
format-warn-prefix = "%{T2}󰸁%{T-} "
format-warn-prefix-foreground = #C46A6A
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = #C46A6A
format-foreground = #9A9A9A

[module/filesystem]
format-mounted-background = #111111
format-mounted-padding = 1
format-unmounted-background = #111111
format-unmounted-padding = 1
type = internal/fs
mount-0 = /
interval = 600
format-mounted-prefix = "%{T2}󰋊%{T-} "
format-mounted-prefix-foreground = #888888
label-mounted = %free%
format-mounted-foreground = #9A9A9A

[module/updates]
format-background = #111111
format-padding = 1
type = custom/script
exec = n=$(checkupdates 2>/dev/null | wc -l); echo "${n:-0}"
interval = 7200
format-prefix = "%{T2}󰚰%{T-} "
format-prefix-foreground = #888888
format-foreground = #D8D8D8
click-left = xfce4-terminal -x sh -c 'sudo pacman -Syu; echo Press Enter to close; read' &

[module/pulseaudio]
format-volume-background = #111111
format-volume-padding = 1
format-muted-background = #111111
format-muted-padding = 1
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-volume-foreground = #D8D8D8
label-muted = %{T2}󰝟%{T-} Mute
label-muted-foreground = #555555
ramp-volume-0 = %{T2}󰕿%{T-}
ramp-volume-1 = %{T2}󰖀%{T-}
ramp-volume-2 = %{T2}󰕾%{T-}
ramp-volume-foreground = #888888
click-right = pavucontrol &

[module/date]
format-background = #111111
format-padding = 1
type = internal/date
interval = 30
date = %a, %b %d · %H:%M
label = %date%
format-prefix = "%{T2}󰃭%{T-} "
format-prefix-foreground = #888888
format-foreground = #F2F2F2
click-left = ~/.local/bin/i3-calendar &

[module/tray]
type = internal/tray
format-margin = 2px
tray-spacing = 4px
tray-size = 12
tray-background = #111111

[module/bluetooth]
format-background = #111111
format-padding = 1
type = custom/script
exec = ~/.local/bin/i3-bluetooth status
interval = 30
format-prefix = "%{T2}󰂯%{T-} "
format-prefix-foreground = #888888
label = %output%
label-foreground = #B8B8B8
click-left = ~/.local/bin/i3-bluetooth popup &

; island caps: rounded Nerd Font glyphs in the island color
[module/cl1]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = #111111
[module/cr1]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = #111111
[module/cl2]
inherit = module/cl1
[module/cl3]
inherit = module/cl1
[module/cl4]
inherit = module/cl1
[module/cr2]
inherit = module/cr1
[module/cr3]
inherit = module/cr1
[module/cr4]
inherit = module/cr1
[module/gap]
type = custom/text
label = " "
