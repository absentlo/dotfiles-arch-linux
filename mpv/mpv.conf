# Graphite mpv - low-spec (HD 8490 decodes H.264 only)
hwdec=vaapi
# UVD3 only decodes these; skip doomed GPU attempts (and their log noise) for VP9/AV1/HEVC
hwdec-codecs=h264,mpeg2video,vc1
# HD 8490 has no Vulkan; default Vulkan lands on the idle Intel iGPU, so render with GL on the Radeon
gpu-api=opengl
# Prefer H.264 <=1080p from YouTube etc. so the GPU decodes it, not the CPU
ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best[height<=?1080]/best
# OSD and subtitles in the rice font and grays
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-color="#D8D8D8"
osd-border-color="#111111"
osd-border-size=2
osd-bar-h=2
sub-font="JetBrainsMono Nerd Font"
sub-color="#D8D8D8"
sub-border-color="#111111"
keep-open=yes
